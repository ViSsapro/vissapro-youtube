<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VissaPro - Official YouTube Hub</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Header Section */
        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #ff0000;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 8px;
        }

        h1 span {
            color: #ff0000;
        }

        p.subtitle {
            color: #aaa;
            font-size: 1.1rem;
        }

        /* Container for Videos */
        .video-container {
            width: 100%;
            max-width: 800px;
            background-color: #1f1f1f;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-details {
            padding: 20px;
        }

        .video-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #fff;
            line-height: 1.4;
        }

        .video-description {
            color: #ccc;
            font-size: 0.95rem;
            line-height: 1.6;
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff0000;
            margin-bottom: 20px;
            white-space: pre-wrap; /* Dynamic line breaks */
            max-height: 150px;
            overflow-y: auto;
        }

        .yt-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #ff0000;
            color: #ffffff;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            transition: background 0.3s ease;
        }

        .yt-btn:hover {
            background-color: #cc0000;
        }

        /* Floating Add Button (+) */
        .add-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #ff0000;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.5);
            cursor: pointer;
            border: none;
            transition: transform 0.2s ease;
            z-index: 1000;
        }

        .add-btn:hover {
            transform: scale(1.1);
        }

        /* Modal Box */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background-color: #222;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: #fff;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #111;
            color: #fff;
            font-size: 1rem;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-submit {
            background-color: #ff0000;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-cancel {
            background-color: #444;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <!-- ඔබගේ Profile Photo එකේ Link එක මෙතැනට දමන්න -->
        <img src="https://via.placeholder.com/120" alt="VissaPro Profile" class="profile-img" id="profilePic">
        <h1>Welcome to <span>VissaPro</span> YouTube Channel</h1>
        <p class="subtitle">නව දැනුම සහ අධ්‍යාපනික වීඩියෝ නැරඹීමට එකතු වන්න!</p>
    </header>

    <!-- Main Content Area where videos appear -->
    <div id="videoList"></div>

    <!-- Floating Add Button (+) -->
    <button class="add-btn" onclick="openModal()"><i class="fa-solid fa-plus"></i></button>

    <!-- Modal Form for Input -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <h3>නව Video එකක් එකතු කරන්න</h3>
            <input type="text" id="ytLinkInput" placeholder="YouTube Video Link හෝ ID එක (e.g., https://youtu.be/xxx)">
            <input type="text" id="customTitle" placeholder="Title (Auto-fetch නොවුවහොත් පමණක් මෙහි ලියන්න)">
            <input type="text" id="customDesc" placeholder="Description (Auto-fetch නොවුවහොත් පමණක් මෙහි ලියන්න)">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-submit" onclick="addNewVideo()">Add Video</button>
            </div>
        </div>
    </div>

    <script>
        // Google Cloud YouTube Data API v3 Key (නොමිලේ ලබාගත හැක)
        const YOUTUBE_API_KEY = "AIzaSyCA6M-37CRLzqW2q-eR25vR2BVplpUTwDU"; 

        // Initial Saved Videos Storage (Local Storage මගින් Save වේ)
        let videosData = JSON.parse(localStorage.getItem('vissaProVideos')) || [];

        function renderVideos() {
            const listContainer = document.getElementById('videoList');
            listContainer.innerHTML = '';

            if (videosData.length === 0) {
                listContainer.innerHTML = '<p style="color:#888; text-align:center;">තවමත් වීඩියෝ එකතු කර නැත. පල්ලෙහා (+) Button එකෙන් එකතු කරන්න.</p>';
                return;
            }

            videosData.forEach((vid, index) => {
                const card = document.createElement('div');
                card.className = 'video-container';
                card.innerHTML = `
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/${vid.id}" allowfullscreen></iframe>
                    </div>
                    <div class="video-details">
                        <h2 class="video-title">${vid.title}</h2>
                        <div class="video-description">${vid.description}</div>
                        <a href="https://www.youtube.com/watch?v=${vid.id}" target="_blank" class="yt-btn">
                            <i class="fa-brands fa-youtube"></i> Watch on YouTube
                        </a>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // Extract Video ID from YouTube URL
        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url;
        }

        // Fetch details automatically using YouTube Data API
        async function fetchVideoDetails(videoId) {
            if (!YOUTUBE_API_KEY || YOUTUBE_API_KEY === "AIzaSyCA6M-37CRLzqW2q-eR25vR2BVplpUTwDU") {
                return null;
            }
            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${videoId}&key=${YOUTUBE_API_KEY}`);
                const data = await response.json();
                if (data.items && data.items.length > 0) {
                    const snippet = data.items[0].snippet;
                    return {
                        title: snippet.title,
                        description: snippet.description.substring(0, 300) + '...' // First 300 chars
                    };
                }
            } catch (err) {
                console.error("API Error: ", err);
            }
            return null;
        }

        async function addNewVideo() {
            const linkInput = document.getElementById('ytLinkInput').value.trim();
            const manualTitle = document.getElementById('customTitle').value.trim();
            const manualDesc = document.getElementById('customDesc').value.trim();

            if (!linkInput) {
                alert('කරුණාකර YouTube Link එකක් ඇතුළත් කරන්න!');
                return;
            }

            const videoId = extractVideoID(linkInput);
            let title = manualTitle;
            let description = manualDesc;

            // Try Auto Fetch via YouTube API
            const apiData = await fetchVideoDetails(videoId);
            if (apiData) {
                title = title || apiData.title;
                description = description || apiData.description;
            }

            // Fallback if API key is not set and manual input is empty
            if (!title) title = "VissaPro New Video";
            if (!description) description = "YouTube එක හරහා වීඩියෝ එක නරඹන්න.";

            // Save to top of list
            videosData.unshift({ id: videoId, title: title, description: description });
            localStorage.setItem('vissaProVideos', JSON.stringify(videosData));

            renderVideos();
            closeModal();

            // Clear inputs
            document.getElementById('ytLinkInput').value = '';
            document.getElementById('customTitle').value = '';
            document.getElementById('customDesc').value = '';
        }

        function openModal() { document.getElementById('videoModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('videoModal').style.display = 'none'; }

        // Initial Load
        renderVideos();
    </script>
</body>
</html>
