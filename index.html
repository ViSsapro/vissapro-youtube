<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VissaPro - Official YouTube Hub</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Header Section */
        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 25px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #ff0000;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 6px;
        }

        h1 span {
            color: #ff0000;
        }

        p.subtitle {
            color: #aaa;
            font-size: 1rem;
        }

        /* Navigation Bar (Tabs) */
        .main-tabs-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 2px solid #222;
            padding-bottom: 15px;
        }

        .main-tab-btn {
            background-color: #1e1e1e;
            color: #aaa;
            padding: 12px 24px;
            border-radius: 25px;
            border: 1px solid #333;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .main-tab-btn.active, .main-tab-btn:hover {
            background-color: #ff0000;
            color: #fff;
            border-color: #ff0000;
        }

        /* Category Filter Pills (When inside Playlist View) */
        .sub-tabs-container {
            width: 100%;
            max-width: 800px;
            margin-bottom: 25px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 8px;
            display: none; /* Shown dynamically */
        }

        .sub-tab-btn {
            display: inline-block;
            background-color: #222;
            color: #ccc;
            padding: 8px 16px;
            margin-right: 8px;
            border-radius: 18px;
            border: 1px solid #333;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .sub-tab-btn.active {
            background-color: #ffffff;
            color: #000;
            font-weight: bold;
        }

        /* Section Container */
        .content-container {
            width: 100%;
            max-width: 800px;
        }

        /* Playlist Grid Layout */
        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .playlist-card {
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .playlist-card:hover {
            transform: translateY(-5px);
            border-color: #ff0000;
        }

        .playlist-card i {
            font-size: 40px;
            color: #ff0000;
            margin-bottom: 12px;
        }

        .playlist-card h3 {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 6px;
        }

        .playlist-card span {
            color: #777;
            font-size: 0.85rem;
        }

        /* Video List Layout */
        .video-container {
            background-color: #1f1f1f;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }

        .video-details {
            padding: 20px;
        }

        .video-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }

        .video-description {
            color: #ccc;
            font-size: 0.95rem;
            line-height: 1.6;
            background-color: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #ff0000;
            margin-bottom: 15px;
            white-space: pre-wrap;
            max-height: 140px;
            overflow-y: auto;
        }

        .yt-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #ff0000;
            color: #ffffff;
            padding: 8px 18px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }

        .yt-btn:hover {
            background-color: #cc0000;
        }

        /* Floating Action Menu (+) */
        .fab-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column-reverse;
            align-items: flex-end;
            gap: 12px;
            z-index: 1000;
        }

        .fab-main {
            width: 60px;
            height: 60px;
            background-color: #ff0000;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.5);
            cursor: pointer;
            border: none;
            transition: transform 0.3s ease;
        }

        .fab-container.active .fab-main {
            transform: rotate(45deg);
            background-color: #444;
        }

        .fab-options {
            display: none;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }

        .fab-container.active .fab-options {
            display: flex;
        }

        .fab-option-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #222;
            color: white;
            padding: 10px 16px;
            border-radius: 25px;
            border: 1px solid #444;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            font-weight: 600;
            white-space: nowrap;
        }

        .fab-option-btn i {
            color: #ff0000;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background-color: #222;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: #fff;
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #111;
            color: #fff;
            font-size: 0.95rem;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-submit {
            background-color: #ff0000;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-cancel {
            background-color: #444;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <img src="https://i.ibb.co/Ps9fcCGK/channels4-profile.jpg" alt="VissaPro Profile Photo" class="profile-img">
        <h1>Welcome to <span>VissaPro</span> YouTube Channel</h1>
        <p class="subtitle">ඔබට අවශ්‍ය වීඩියෝ සහ Playlists මෙතැනින් බලන්න!</p>
    </header>

    <!-- Main Navigation Tabs -->
    <div class="main-tabs-container">
        <button class="main-tab-btn active" id="tabAllVideosBtn" onclick="switchMainView('videos')">
            <i class="fa-solid fa-play"></i> All Videos
        </button>
        <button class="main-tab-btn" id="tabPlaylistsBtn" onclick="switchMainView('playlists')">
            <i class="fa-solid fa-folder-open"></i> All Playlists
        </button>
    </div>

    <!-- Playlist Sub-Tabs (Shown inside Playlists view) -->
    <div class="sub-tabs-container" id="playlistSubTabs"></div>

    <!-- Dynamic Content Container -->
    <div class="content-container" id="mainContent"></div>

    <!-- Floating Action Menu (+) -->
    <div class="fab-container" id="fabContainer">
        <button class="fab-main" onclick="handleFabClick()"><i class="fa-solid fa-plus"></i></button>
        <div class="fab-options">
            <button class="fab-option-btn" onclick="openPlaylistModal()">
                <i class="fa-solid fa-folder-plus"></i> + Add Playlist
            </button>
            <button class="fab-option-btn" onclick="openVideoModal()">
                <i class="fa-solid fa-video"></i> + Add Video
            </button>
        </div>
    </div>

    <!-- Modal: Add New Playlist -->
    <div class="modal" id="playlistModal">
        <div class="modal-content">
            <h3>නව Playlist එකක් සාදන්න</h3>
            <input type="text" id="playlistNameInput" placeholder="Playlist Name (e.g. Trading Course)">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModals()">Cancel</button>
                <button class="btn-submit" onclick="addPlaylist()">Create Playlist</button>
            </div>
        </div>
    </div>

    <!-- Modal: Add New Video -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <h3>නව Video එකක් එකතු කරන්න</h3>
            <label style="color:#aaa; font-size:0.85rem; margin-bottom:5px; display:block;">Playlist එකක් තෝරන්න (අවශ්‍ය නම් පමණක්):</label>
            <select id="playlistSelect">
                <option value="none">-- None (Single Video / Direct Upload) --</option>
            </select>

            <input type="text" id="ytLinkInput" placeholder="YouTube Link (e.g., https://youtu.be/xxx)">
            <input type="text" id="customTitle" placeholder="Title (Auto-fetch නොවුවහොත් පමණක් ලියන්න)">
            <input type="text" id="customDesc" placeholder="Description (Auto-fetch නොවුවහොත් පමණක් ලියන්න)">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModals()">Cancel</button>
                <button class="btn-submit" onclick="addVideo()">Add Video</button>
            </div>
        </div>
    </div>

    <script>
        const YOUTUBE_API_KEY = "AIzaSyCA6M-37CRLzqW2q-eR25vR2BVplpUTwDU";
        const ADMIN_PASSWORD = "1234"; 
        let isAuthenticated = false;

        // Data Structure
        let singleVideos = JSON.parse(localStorage.getItem('vissaSingleVideos')) || [];
        let playlistsData = JSON.parse(localStorage.getItem('vissaPlaylistsData')) || [];

        let currentView = 'videos'; // 'videos' or 'playlists'
        let selectedPlaylistId = null; // null means viewing playlist list

        function handleFabClick() {
            if (!isAuthenticated) {
                const inputPass = prompt("Admin Password එක ඇතුළත් කරන්න:");
                if (inputPass === ADMIN_PASSWORD) {
                    isAuthenticated = true;
                    alert("Password සාර්ථකයි! දැන් ඔබට Videos එකතු කළ හැක.");
                    toggleFab();
                } else if (inputPass !== null) {
                    alert("වැරදි Password එකක්!");
                }
            } else {
                toggleFab();
            }
        }

        function toggleFab() {
            document.getElementById('fabContainer').classList.toggle('active');
        }

        function switchMainView(view) {
            currentView = view;
            selectedPlaylistId = null;

            document.getElementById('tabAllVideosBtn').classList.toggle('active', view === 'videos');
            document.getElementById('tabPlaylistsBtn').classList.toggle('active', view === 'playlists');

            render();
        }

        function render() {
            const container = document.getElementById('mainContent');
            const subTabs = document.getElementById('playlistSubTabs');
            container.innerHTML = '';
            subTabs.style.display = 'none';

            if (currentView === 'videos') {
                // Show ALL Videos (Single Videos + Playlist Videos combined)
                let allCombined = [...singleVideos];
                playlistsData.forEach(pl => {
                    allCombined = allCombined.concat(pl.videos);
                });

                if (allCombined.length === 0) {
                    container.innerHTML = '<p style="color:#888; text-align:center; padding:40px;">තවමත් වීඩියෝ නොමැත. පල්ලෙහා (+) icon එකෙන් එකතු කරන්න.</p>';
                    return;
                }
                renderVideoCards(allCombined, container);

            } else if (currentView === 'playlists') {
                if (selectedPlaylistId === null) {
                    // Render Playlists Grid Overview
                    if (playlistsData.length === 0) {
                        container.innerHTML = '<p style="color:#888; text-align:center; padding:40px;">තවමත් Playlists නොමැත. පල්ලෙහා (+) icon එකෙන් Playlist එකක් සාදන්න.</p>';
                        return;
                    }

                    const grid = document.createElement('div');
                    grid.className = 'playlist-grid';

                    playlistsData.forEach(pl => {
                        const card = document.createElement('div');
                        card.className = 'playlist-card';
                        card.onclick = () => {
                            selectedPlaylistId = pl.id;
                            render();
                        };
                        card.innerHTML = `
                            <i class="fa-solid fa-layer-group"></i>
                            <h3>${pl.name}</h3>
                            <span>${pl.videos.length} Videos</span>
                        `;
                        grid.appendChild(card);
                    });
                    container.appendChild(grid);

                } else {
                    // Render Specific Playlist Videos
                    subTabs.style.display = 'flex';
                    renderSubTabs();

                    const currentPl = playlistsData.find(pl => pl.id === selectedPlaylistId);
                    if (currentPl) {
                        if (currentPl.videos.length === 0) {
                            container.innerHTML = `<p style="color:#888; text-align:center; padding:40px;">"${currentPl.name}" එකේ තවමත් වීඩියෝ නොමැත.</p>`;
                        } else {
                            renderVideoCards(currentPl.videos, container);
                        }
                    }
                }
            }
        }

        function renderSubTabs() {
            const subTabs = document.getElementById('playlistSubTabs');
            subTabs.innerHTML = '';

            // Back to all playlists button
            const backBtn = document.createElement('button');
            backBtn.className = 'sub-tab-btn';
            backBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i> සියලුම Playlists';
            backBtn.onclick = () => { selectedPlaylistId = null; render(); };
            subTabs.appendChild(backBtn);

            playlistsData.forEach(pl => {
                const btn = document.createElement('button');
                btn.className = `sub-tab-btn ${pl.id === selectedPlaylistId ? 'active' : ''}`;
                btn.innerText = pl.name;
                btn.onclick = () => { selectedPlaylistId = pl.id; render(); };
                subTabs.appendChild(btn);
            });
        }

        function renderVideoCards(videos, targetElem) {
            videos.forEach(vid => {
                const card = document.createElement('div');
                card.className = 'video-container';
                card.innerHTML = `
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/${vid.id}" allowfullscreen></iframe>
                    </div>
                    <div class="video-details">
                        <h2 class="video-title">${vid.title}</h2>
                        <div class="video-description">${vid.description}</div>
                        <a href="https://www.youtube.com/watch?v=${vid.id}" target="_blank" class="yt-btn">
                            <i class="fa-brands fa-youtube"></i> Watch on YouTube
                        </a>
                    </div>
                `;
                targetElem.appendChild(card);
            });
        }

        function addPlaylist() {
            const name = document.getElementById('playlistNameInput').value.trim();
            if (!name) { alert('කරුණාකර Playlist එක සඳහා නමක් ඇතුළත් කරන්න!'); return; }

            const newId = 'pl_' + Date.now();
            playlistsData.push({ id: newId, name: name, videos: [] });
            saveData();
            closeModals();
            document.getElementById('playlistNameInput').value = '';
            switchMainView('playlists');
        }

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url;
        }

        async function fetchVideoDetails(videoId) {
            if (!YOUTUBE_API_KEY) return null;
            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${videoId}&key=${YOUTUBE_API_KEY}`);
                const data = await response.json();
                if (data.items && data.items.length > 0) {
                    return {
                        title: data.items[0].snippet.title,
                        description: data.items[0].snippet.description.substring(0, 300) + '...'
                    };
                }
            } catch (err) { console.error('API Fetch Error:', err); }
            return null;
        }

        async function addVideo() {
            const targetPlId = document.getElementById('playlistSelect').value;
            const linkInput = document.getElementById('ytLinkInput').value.trim();
            let title = document.getElementById('customTitle').value.trim();
            let description = document.getElementById('customDesc').value.trim();

            if (!linkInput) { alert('කරුණාකර YouTube Video Link එකක් ඇතුළත් කරන්න!'); return; }

            const videoId = extractVideoID(linkInput);
            const apiData = await fetchVideoDetails(videoId);

            if (apiData) {
                title = title || apiData.title;
                description = description || apiData.description;
            }

            if (!title) title = "VissaPro Video";
            if (!description) description = "YouTube එක හරහා වීඩියෝ එක නරඹන්න.";

            const newVidObj = { id: videoId, title: title, description: description };

            if (targetPlId === 'none') {
                // Save as Single Independent Video
                singleVideos.unshift(newVidObj);
            } else {
                // Save inside specific Playlist
                const targetPl = playlistsData.find(pl => pl.id === targetPlId);
                if (targetPl) targetPl.videos.unshift(newVidObj);
            }

            saveData();
            closeModals();
            document.getElementById('ytLinkInput').value = '';
            document.getElementById('customTitle').value = '';
            document.getElementById('customDesc').value = '';
            render();
        }

        function openPlaylistModal() {
            toggleFab();
            document.getElementById('playlistModal').style.display = 'flex';
        }

        function openVideoModal() {
            toggleFab();
            const select = document.getElementById('playlistSelect');
            select.innerHTML = '<option value="none">-- None (Single Video / Direct Upload) --</option>';

            playlistsData.forEach(pl => {
                select.innerHTML += `<option value="${pl.id}">${pl.name}</option>`;
            });

            document.getElementById('videoModal').style.display = 'flex';
        }

        function closeModals() {
            document.getElementById('playlistModal').style.display = 'none';
            document.getElementById('videoModal').style.display = 'none';
        }

        function saveData() {
            localStorage.setItem('vissaSingleVideos', JSON.stringify(singleVideos));
            localStorage.setItem('vissaPlaylistsData', JSON.stringify(playlistsData));
        }

        // Initial Load
        render();
    </script>
</body>
</html>
