<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VissaPro - Authentication & Portal</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ------------------ LOGIN SCREEN STYLES ------------------ */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background-color: #181818;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 35px 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .login-profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #ff0000;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }

        .login-card h2 {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .login-card h2 span {
            color: #ff0000;
        }

        .login-card p.desc {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .auth-btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .auth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 12px 16px;
            border-radius: 25px;
            border: none;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-google {
            background-color: #ffffff;
            color: #222222;
        }

        .btn-facebook {
            background-color: #1877f2;
            color: #ffffff;
        }

        .btn-email {
            background-color: #ff0000;
            color: #ffffff;
        }

        /* Modal for Email OTP Verification */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            background-color: #222;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }

        .modal-content h3 {
            margin-bottom: 10px;
            color: #fff;
        }

        .modal-content p {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 15px;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #111;
            color: #fff;
            font-size: 0.95rem;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-submit {
            background-color: #ff0000;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-cancel {
            background-color: #444;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }


        /* ------------------ MAIN APP SCREEN STYLES ------------------ */
        .app-wrapper {
            display: none;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            flex-direction: column;
            align-items: center;
        }

        .top-navbar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #181818;
            padding: 10px 20px;
            border-radius: 30px;
            margin-bottom: 25px;
            border: 1px solid #333;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .user-badge i {
            color: #ff0000;
        }

        .badge-role {
            background: #333;
            color: #aaa;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-left: 5px;
        }

        .badge-role.admin {
            background: #ff0000;
            color: #fff;
        }

        .btn-logout {
            background: #333;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }

        .btn-logout:hover {
            background: #555;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #ff0000;
            object-fit: cover;
            margin-bottom: 12px;
        }

        /* Main Nav Tabs */
        .main-tabs-container {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 2px solid #222;
            padding-bottom: 15px;
        }

        .main-tab-btn {
            background-color: #1e1e1e;
            color: #aaa;
            padding: 12px 24px;
            border-radius: 25px;
            border: 1px solid #333;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .main-tab-btn.active, .main-tab-btn:hover {
            background-color: #ff0000;
            color: #fff;
            border-color: #ff0000;
        }

        /* Sub Tabs */
        .sub-tabs-container {
            width: 100%;
            margin-bottom: 25px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 8px;
            display: none;
        }

        .sub-tab-btn {
            display: inline-block;
            background-color: #222;
            color: #ccc;
            padding: 8px 16px;
            margin-right: 8px;
            border-radius: 18px;
            border: 1px solid #333;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .sub-tab-btn.active {
            background-color: #ffffff;
            color: #000;
        }

        .content-container {
            width: 100%;
        }

        /* Playlist Grid */
        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .playlist-card {
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .playlist-card:hover {
            transform: translateY(-5px);
            border-color: #ff0000;
        }

        .playlist-card i {
            font-size: 40px;
            color: #ff0000;
            margin-bottom: 12px;
        }

        /* Video List */
        .video-container {
            background-color: #1f1f1f;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }

        .video-details {
            padding: 20px;
        }

        .video-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .video-description {
            color: #ccc;
            font-size: 0.95rem;
            line-height: 1.6;
            background-color: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #ff0000;
            margin-bottom: 15px;
            white-space: pre-wrap;
            max-height: 140px;
            overflow-y: auto;
        }

        .yt-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #ff0000;
            color: #ffffff;
            padding: 8px 18px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        /* Floating (+) Button - Only for Admin */
        .fab-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: none;
            flex-direction: column-reverse;
            align-items: flex-end;
            gap: 12px;
            z-index: 1000;
        }

        .fab-main {
            width: 60px;
            height: 60px;
            background-color: #ff0000;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.5);
            cursor: pointer;
            border: none;
            transition: transform 0.3s ease;
        }

        .fab-container.active .fab-main {
            transform: rotate(45deg);
            background-color: #444;
        }

        .fab-options {
            display: none;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }

        .fab-container.active .fab-options {
            display: flex;
        }

        .fab-option-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #222;
            color: white;
            padding: 10px 16px;
            border-radius: 25px;
            border: 1px solid #444;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }

        .fab-option-btn i {
            color: #ff0000;
        }
    </style>
</head>
<body>

    <!-- ================================================================= -->

    <div class="login-wrapper" id="loginScreen">

    <script>
        // EmailJS Init - Integrated Public Key
        (function(){
            emailjs.init("PjusIs1VJ5zFRcuZp");
        })();

        const YOUTUBE_API_KEY = "AIzaSyCA6M-37CRLzqW2q-eR25vR2BVplpUTwDU";
        
        // ---------------------------------------------------------------------
        // 🔑 ADMIN GMAIL ADDRESS
        const MY_ADMIN_GMAIL = "vimukthithuhina754@gmail.com"; 
        // ---------------------------------------------------------------------

        let generatedOTP = null;
        let pendingEmail = "";

        // App Data
        let singleVideos = JSON.parse(localStorage.getItem('vissaSingleVideos')) || [];
        let playlistsData = JSON.parse(localStorage.getItem('vissaPlaylistsData')) || [];
        let currentView = 'videos';
        let selectedPlaylistId = null;

        // Auto Check Session on Load
        window.onload = function() {
            const loggedUser = localStorage.getItem('vissaLoggedUser');
            if (loggedUser) {
                initDashboard(loggedUser);
            }
        };

        // --- EMAIL OTP AUTHENTICATION ---

        function openEmailModal() {
            document.getElementById('emailAuthModal').style.display = 'flex';
            document.getElementById('otpStep1').style.display = 'block';
            document.getElementById('otpStep2').style.display = 'none';
        }

        function closeAuthModal() {
            document.getElementById('emailAuthModal').style.display = 'none';
        }

        function sendOTPCode() {
            const userEmail = document.getElementById('userEmailInput').value.trim();
            if (!userEmail || !userEmail.includes('@')) {
                alert('කරුණාකර නිවැරදි Email ලිපිනයක් ඇතුළත් කරන්න!');
                return;
            }

            pendingEmail = userEmail;
            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

            const templateParams = {
                email: userEmail,
                passcode: generatedOTP
            };

            emailjs.send('service_0dhcgr3', 'template_cu3r1wj', templateParams)
                .then(function(response) {
                    alert(`Verification Code එක ${userEmail} වෙත යවන ලදී. කරුණාකර Inbox/Spam පරීක්ෂා කරන්න.`);
                    document.getElementById('otpStep1').style.display = 'none';
                    document.getElementById('otpStep2').style.display = 'block';
                    document.getElementById('emailModalDesc').innerText = `${userEmail} වෙත යවන ලද 6-digit කෝඩ් එක ඇතුළත් කරන්න.`;
                }, function(error) {
                    alert('Email යැවීමේදී දෝෂයක් සිදු විය: ' + JSON.stringify(error));
                });
        }

        function verifyOTPCode() {
            const userEnteredOTP = document.getElementById('otpInput').value.trim();

            if (userEnteredOTP === generatedOTP) {
                alert('Email Verification සාර්ථකයි!');
                closeAuthModal();
                loginSuccess(pendingEmail);
            } else {
                alert('වැරදි Verification Code එකකි. නැවත උත්සාහ කරන්න.');
            }
        }

        // Handle Logged-In State
        function loginSuccess(email) {
            localStorage.setItem('vissaLoggedUser', email);
            initDashboard(email);
        }

        function initDashboard(email) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'flex';
            document.getElementById('displayUserEmail').innerText = email;

            const roleElem = document.getElementById('displayUserRole');
            const fabElem = document.getElementById('fabContainer');

            // Check if user is ADMIN
            if (email.toLowerCase() === MY_ADMIN_GMAIL.toLowerCase()) {
                roleElem.innerText = "Admin (Creator)";
                roleElem.className = "badge-role admin";
                fabElem.style.display = "flex";
            } else {
                roleElem.innerText = "Viewer";
                roleElem.className = "badge-role";
                fabElem.style.display = "none";
            }

            render();
        }

        function logout() {
            localStorage.removeItem('vissaLoggedUser');
            document.getElementById('appScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
        }

        // --- DASHBOARD UI & RENDER LOGIC ---

        function toggleFab() {
            document.getElementById('fabContainer').classList.toggle('active');
        }

        function switchMainView(view) {
            currentView = view;
            selectedPlaylistId = null;

            document.getElementById('tabAllVideosBtn').classList.toggle('active', view === 'videos');
            document.getElementById('tabPlaylistsBtn').classList.toggle('active', view === 'playlists');

            render();
        }

        function render() {
            const container = document.getElementById('mainContent');
            const subTabs = document.getElementById('playlistSubTabs');
            container.innerHTML = '';
            subTabs.style.display = 'none';

            if (currentView === 'videos') {
                let allCombined = [...singleVideos];
                playlistsData.forEach(pl => {
                    allCombined = allCombined.concat(pl.videos);
                });

                if (allCombined.length === 0) {
                    container.innerHTML = '<p style="color:#888; text-align:center; padding:40px;">තවමත් වීඩියෝ නොමැත.</p>';
                    return;
                }
                renderVideoCards(allCombined, container);

            } else if (currentView === 'playlists') {
                if (selectedPlaylistId === null) {
                    if (playlistsData.length === 0) {
                        container.innerHTML = '<p style="color:#888; text-align:center; padding:40px;">තවමත් Playlists නොමැත.</p>';
                        return;
                    }

                    const grid = document.createElement('div');
                    grid.className = 'playlist-grid';

                    playlistsData.forEach(pl => {
                        const card = document.createElement('div');
                        card.className = 'playlist-card';
                        card.onclick = () => {
                            selectedPlaylistId = pl.id;
                            render();
                        };
                        card.innerHTML = `
                            <i class="fa-solid fa-layer-group"></i>
                            <h3>${pl.name}</h3>
                            <span style="color:#777; font-size:0.85rem;">${pl.videos.length} Videos</span>
                        `;
                        grid.appendChild(card);
                    });
                    container.appendChild(grid);

                } else {
                    subTabs.style.display = 'flex';
                    renderSubTabs();

                    const currentPl = playlistsData.find(pl => pl.id === selectedPlaylistId);
                    if (currentPl) {
                        if (currentPl.videos.length === 0) {
                            container.innerHTML = `<p style="color:#888; text-align:center; padding:40px;">"${currentPl.name}" එකේ තවමත් වීඩියෝ නොමැත.</p>`;
                        } else {
                            renderVideoCards(currentPl.videos, container);
                        }
                    }
                }
            }
        }

        function renderSubTabs() {
            const subTabs = document.getElementById('playlistSubTabs');
            subTabs.innerHTML = '';

            const backBtn = document.createElement('button');
            backBtn.className = 'sub-tab-btn';
            backBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i> සියලුම Playlists';
            backBtn.onclick = () => { selectedPlaylistId = null; render(); };
            subTabs.appendChild(backBtn);

            playlistsData.forEach(pl => {
                const btn = document.createElement('button');
                btn.className = `sub-tab-btn ${pl.id === selectedPlaylistId ? 'active' : ''}`;
                btn.innerText = pl.name;
                btn.onclick = () => { selectedPlaylistId = pl.id; render(); };
                subTabs.appendChild(btn);
            });
        }

        function renderVideoCards(videos, targetElem) {
            videos.forEach(vid => {
                const card = document.createElement('div');
                card.className = 'video-container';
                card.innerHTML = `
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/${vid.id}" allowfullscreen></iframe>
                    </div>
                    <div class="video-details">
                        <h2 class="video-title">${vid.title}</h2>
                        <div class="video-description">${vid.description}</div>
                        <a href="https://www.youtube.com/watch?v=${vid.id}" target="_blank" class="yt-btn">
                            <i class="fa-brands fa-youtube"></i> Watch on YouTube
                        </a>
                    </div>
                `;
                targetElem.appendChild(card);
            });
        }

        // --- ADMIN ADD CONTENT LOGIC ---

        function addPlaylist() {
            const name = document.getElementById('playlistNameInput').value.trim();
            if (!name) { alert('කරුණාකර Playlist එක සඳහා නමක් ඇතුළත් කරන්න!'); return; }

            const newId = 'pl_' + Date.now();
            playlistsData.push({ id: newId, name: name, videos: [] });
            saveData();
            closeAdminModals();
            document.getElementById('playlistNameInput').value = '';
            switchMainView('playlists');
        }

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url;
        }

        async function fetchVideoDetails(videoId) {
            if (!YOUTUBE_API_KEY) return null;
            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${videoId}&key=${YOUTUBE_API_KEY}`);
                const data = await response.json();
                if (data.items && data.items.length > 0) {
                    return {
                        title: data.items[0].snippet.title,
                        description: data.items[0].snippet.description.substring(0, 300) + '...'
                    };
                }
            } catch (err) { console.error('API Fetch Error:', err); }
            return null;
        }

        async function addVideo() {
            const targetPlId = document.getElementById('playlistSelect').value;
            const linkInput = document.getElementById('ytLinkInput').value.trim();
            let title = document.getElementById('customTitle').value.trim();
            let description = document.getElementById('customDesc').value.trim();

            if (!linkInput) { alert('කරුණාකර YouTube Video Link එකක් ඇතුළත් කරන්න!'); return; }

            const videoId = extractVideoID(linkInput);
            const apiData = await fetchVideoDetails(videoId);

            if (apiData) {
                title = title || apiData.title;
                description = description || apiData.description;
            }

            if (!title) title = "VissaPro Video";
            if (!description) description = "YouTube එක හරහා වීඩියෝ එක නරඹන්න.";

            const newVidObj = { id: videoId, title: title, description: description };

            if (targetPlId === 'none') {
                singleVideos.unshift(newVidObj);
            } else {
                const targetPl = playlistsData.find(pl => pl.id === targetPlId);
                if (targetPl) targetPl.videos.unshift(newVidObj);
            }

            saveData();
            closeAdminModals();
            document.getElementById('ytLinkInput').value = '';
            document.getElementById('customTitle').value = '';
            document.getElementById('customDesc').value = '';
            render();
        }

        function openPlaylistModal() {
            toggleFab();
            document.getElementById('playlistModal').style.display = 'flex';
        }

        function openVideoModal() {
            toggleFab();
            const select = document.getElementById('playlistSelect');
            select.innerHTML = '<option value="none">-- None (Single Video / Direct Upload) --</option>';

            playlistsData.forEach(pl => {
                select.innerHTML += `<option value="${pl.id}">${pl.name}</option>`;
            });

            document.getElementById('videoModal').style.display = 'flex';
        }

        function closeAdminModals() {
            document.getElementById('playlistModal').style.display = 'none';
            document.getElementById('videoModal').style.display = 'none';
        }

        function saveData() {
            localStorage.setItem('vissaSingleVideos', JSON.stringify(singleVideos));
            localStorage.setItem('vissaPlaylistsData', JSON.stringify(playlistsData));
        }
    </script>
</body>
</html>
